<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>인큐브 홈페이지 시안 보고</title>
    <style>
      body {
        font-family: sans-serif;
        background: #fafafa;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .container {
        text-align: center;
        background: white;
        padding: 3rem;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      }
      h1 {
        margin-bottom: 2rem;
        font-size: 1.5rem;
        color: #333;
      }
      a {
        display: block;
        margin: 1rem 0;
        padding: 1rem 2rem;
        background: #333;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        transition: background 0.3s;
      }
      a:hover {
        background: rgb(224, 130, 5);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>인큐브 신규 홈페이지 시안 리스트</h1>
      <a href="incube1/" target="_blank">▶ 시안 1 보기 (분할 레이아웃)</a>
      <a href="incube2/" target="_blank">▶ 시안 2 보기 (로고 베리에이션)</a>
      <a href="incube3/" target="_blank">▶ 시안 3 보기 (원페이지 스크롤)</a>
    </div>
  </body>
</html>
